name: Generate Top Languages Card

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=DavidLimm&layout=compact&langs_count=5&theme=dracula'
          path: output/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to languages-output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: languages-output
          force_orphan: true
