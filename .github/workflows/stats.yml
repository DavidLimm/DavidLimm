name: Generate Stats Card

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=DavidLimm&show_icons=true&theme=dracula&include_all_commits=true&count_private=true'
          path: output/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to stats-output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: stats-output
          force_orphan: true
