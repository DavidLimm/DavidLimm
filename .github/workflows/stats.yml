name: Generate Stats Card

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate stats card
        uses: jstrippel/github-stats-transparent@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: DavidLimm
          output_branch: stats-output
          hide_title: false
          hide_rank: false
          show_icons: true
          include_all_commits: true
          count_private: true
          theme: dracula
